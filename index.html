<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Belajar Anak</title>
    <style>
        /* Pengaturan Umum & Animasi Transisi */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background 0.5s ease;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            color: white;
            transition: all 0.5s ease;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* Tombol Modern & Ceria */
        .btn {
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* --- 1. MENU UTAMA (HIJAU MODERN) --- */
        body.theme-main {
            background: linear-gradient(135deg, #A8E063, #56AB2F);
        }
        .theme-main .container {
            background: linear-gradient(135deg, #76B947, #3E8E41);
        }
        .theme-main .btn-action {
            background: linear-gradient(135deg, #6BE585, #22B14C);
        }

        /* --- 2. LE 1 (BIRU MUDA MODERN) --- */
        body.theme-le1 {
            background: linear-gradient(135deg, #89F7FE, #66A6FF);
        }
        .theme-le1 .container {
            background: linear-gradient(135deg, #4FACFE, #00F2FE);
        }
        .theme-le1 .btn-action {
            background: linear-gradient(135deg, #00C6FF, #0072FF);
        }

        /* --- 3. LE 2 (COKLAT MUDA MODERN) --- */
        body.theme-le2 {
            background: linear-gradient(135deg, #E6C594, #B8860B);
        }
        .theme-le2 .container {
            background: linear-gradient(135deg, #D2B48C, #A0522D);
        }
        .theme-le2 .btn-action {
            background: linear-gradient(135deg, #CD853F, #8B4513);
        }

        /* --- 4. LE 3 (MERAH MODERN) --- */
        body.theme-le3 {
            background: linear-gradient(135deg, #FF9A8E, #FF6A88);
        }
        .theme-le3 .container {
            background: linear-gradient(135deg, #FF5E62, #FF9966);
        }
        .theme-le3 .btn-action {
            background: linear-gradient(135deg, #FF416C, #FF4B2B);
        }

        /* --- 5. CT (ORANYE MODERN) --- */
        body.theme-ct {
            background: linear-gradient(135deg, #FFECD2, #FCB69F);
        }
        .theme-ct .container {
            background: linear-gradient(135deg, #FFA07A, #FF7F50);
        }
        .theme-ct .btn-action {
            background: linear-gradient(135deg, #FF8008, #FFC837);
        }
    </style>
</head>
<body class="theme-main" id="bodyTheme">

    <div class="container" id="appContainer">
        <h1 id="appTitle">Menu Utama</h1>
        
        <div class="card">
            <p id="cardText">Kotak Konten / Pertanyaan Game Anak</p>
        </div>

        <!-- Tombol Aksi Utama & Tombol "Periksa Lagi" yang Sebelumnya Hilang -->
        <div>
            <button class="btn btn-action" id="mainButton" onclick="ubahTema('le1')">Mulai</button>
            <button class="btn btn-action" id="btnPeriksa" onclick="aksiPeriksa()">Periksa Lagi</button>
        </div>

        <div style="margin-top: 15px; font-size: 14px;">
            <p>Pilih Tema Tes:</p>
            <button onclick="ubahTema('main')" style="padding: 5px 10px;">Hijau</button>
            <button onclick="ubahTema('le1')" style="padding: 5px 10px;">Biru</button>
            <button onclick="ubahTema('le2')" style="padding: 5px 10px;">Coklat</button>
            <button onclick="ubahTema('le3')" style="padding: 5px 10px;">Merah</button>
            <button onclick="ubahTema('ct')" style="padding: 5px 10px;">Oranye</button>
        </div>
    </div>

    <script>
        function ubahTema(jenis) {
            const body = document.getElementById('bodyTheme');
            const title = document.getElementById('appTitle');
            const text = document.getElementById('cardText');
            
            // Hapus semua kelas tema sebelumnya
            body.className = '';

            if (jenis === 'main') {
                body.classList.add('theme-main');
                title.innerText = 'Menu Utama';
                text.innerText = 'Selamat datang di Menu Utama!';
            } else if (jenis === 'le1') {
                body.classList.add('theme-le1');
                title.innerText = 'Level 1 (LE 1)';
                text.innerText = 'Ayo selesaikan tantangan Biru Muda ini!';
            } else if (jenis === 'le2') {
                body.classList.add('theme-le2');
                title.innerText = 'Level 2 (LE 2)';
                text.innerText = 'Hadapi tantangan Coklat Muda yang seru!';
            } else if (jenis === 'le3') {
                body.classList.add('theme-le3');
                title.innerText = 'Level 3 (LE 3)';
                text.innerText = 'Hati-hati, tantangan Merah dimulai!';
            } else if (jenis === 'ct') {
                body.classList.add('theme-ct');
                title.innerText = 'Challenge Time (CT)';
                text.innerText = 'Uji kemampuanmu di Oranye ceria!';
            }
        }

        function aksiPeriksa() {
            alert("Tombol Periksa Lagi diklik! Jawaban sedang diperiksa...");
        }
    </script>

</body>
</html>
