<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Number Bond Ratusan!</title>
    <!-- Memuat Font Lucu dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 550px;
            text-align: center;
            border: 5px solid #ff7675;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #d63031;
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #ffeaa7;
        }

        .subtitle {
            font-size: 14px;
            color: #636e72;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #ffeaa7;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: 700;
            color: #d35400;
            font-size: 16px;
        }

        /* Number Bond Visual (Pohon Angka) */
        .bond-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }

        .circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fredoka One', cursive;
            font-size: 26px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* Lingkaran Atas (Total/Hasil) */
        .top-circle {
            background: #ff7675;
            color: white;
            border: 4px dashed #fab1a0;
            margin-bottom: 50px; /* Beri jarak lebih besar untuk garis */
        }

        /* --- BAGIAN PERBAIKAN GARIS (Branch Lines) --- */
        .branch-lines {
            width: 150px;  /* Lebar dasar tempat garis berada */
            height: 40px;  /* Tinggi vertikal garis */
            position: absolute;
            top: 75px; /* Mengatur posisi vertikal di bawah lingkaran atas */
        }

        .branch-lines::before, .branch-lines::after {
            content: '';
            position: absolute;
            top: 0;
            width: 4px; /* Ketebalan garis */
            height: 45px; /* Panjang garis */
            background-color: #a0a0a0; /* Warna garis */
            border-radius: 2px;
        }

        /* Garis Kiri: Miring ke kiri (\) */
        .branch-lines::before {
            left: 0;
            transform: rotate(-25deg);
        }

        /* Garis Kanan: Miring ke kanan (/) */
        .branch-lines::after {
            right: 0;
            transform: rotate(25deg);
        }
        /* --- SELESAI PERBAIKAN GARIS --- */

        .bottom-circles {
            display: flex;
            justify-content: space-between;
            width: 260px; /* Lebar sejajar garis bawah */
        }

        /* Lingkaran Bawah (Bagian-bagian) */
        .part-circle {
            background: #74b9ff;
            color: white;
            border: 4px dashed #81ecec;
        }

        .part-circle.input-box-wrapper {
            background: #dfe6e9;
            border: 4px solid #b2bec3;
        }

        .part-circle input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            color: #2d3436;
            outline: none;
            border-radius: 50%;
        }

        /* Menghilangkan spinner default input type=number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Kontrol Input & Tombol */
        .input-section {
            margin-bottom: 20px;
        }

        .btn {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 12px 30px;
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #00a884;
            transition: all 0.1s ease;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #00a884;
        }

        /* Feedback Pesan */
        #feedback {
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            margin-top: 15px;
            min-height: 30px;
        }

        .correct { color: #00b894; }
        .wrong { color: #d63031; }

        /* Tampilan Selesai / Game Over */
        .hidden {
            display: none !important;
        }

        .modal {
            animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }

        .mascot {
            font-size: 40px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Halaman Bermain -->
        <div id="game-screen">
            <div class="mascot">🚀🦊</div>
            <h1>Number Bond Ratusan</h1>
            <div class="subtitle">Tentukan angka yang hilang pada pohon angka!</div>

            <div class="stats-bar">
                <span id="score-text">Skor: 0</span>
                <span id="level-text">Soal: 1 / 10</span>
            </div>

            <!-- Pohon Number Bond -->
            <div class="bond-container">
                <!-- Total Atas -->
                <div id="top-val" class="circle top-circle">500</div>
                
                <!-- Garis Penghubung (Bentuk \ / ) -->
                <div class="branch-lines"></div>

                <!-- Bagian Bawah -->
                <div class="bottom-circles">
                    <div id="left-val" class="circle part-circle">200</div>
                    <div id="right-val" class="circle part-circle input-box-wrapper">
                        <input type="number" id="user-input" placeholder="?" autocomplete="off" inputmode="numeric">
                    </div>
                </div>
            </div>

            <div class="input-section">
                <button class="btn" id="submit-btn" onclick="cekJawaban()">Periksa! ✨</button>
            </div>

            <div id="feedback"></div>
        </div>

        <!-- Halaman Hasil Akhir -->
        <div id="result-screen" class="hidden modal">
            <div class="mascot">🏆🎉</div>
            <h1>Hebat Sekali!</h1>
            <p class="subtitle">Kamu telah menyelesaikan petualangan Number Bond!</p>
            <h2 id="final-score" style="font-family: 'Fredoka One'; color: #00b894; font-size: 36px; margin: 20px 0;">Skor Akhir: 100</h2>
            <button class="btn" onclick="mulaiGame()">Main Lagi 🔄</button>
        </div>
    </div>

    <script>
        let skor = 0;
        let soalKe = 1;
        let totalSoal = 10;
        let jawabanBenar = 0;
        let posisiKosong = 0; // 0 = kanan, 1 = kiri, 2 = atas

        const topValEl = document.getElementById('top-val');
        const leftValEl = document.getElementById('left-val');
        const rightValEl = document.getElementById('right-val');
        const feedbackEl = document.getElementById('feedback');
        const scoreText = document.getElementById('score-text');
        const levelText = document.getElementById('level-text');
        
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const finalScore = document.getElementById('final-score');

        function mulaiGame() {
            skor = 0;
            soalKe = 1;
            gameScreen.classList.remove('hidden');
            resultScreen.classList.add('hidden');
            buatSoalBaru();
        }

        function buatSoalBaru() {
            feedbackEl.innerHTML = '';
            document.getElementById('submit-btn').style.display = 'inline-block';
            
            scoreText.innerText = `Skor: ${skor}`;
            levelText.innerText = `Soal: ${soalKe} / ${totalSoal}`;

            // Generate angka: total ratusan acak (misal 200 - 900)
            let total = Math.floor(Math.random() * 7 + 2) * 100;
            // Generate bagian pertama (kurang dari total, kelipatan 10)
            let bagianA = Math.floor(Math.random() * (total/10 - 2) + 1) * 10; 
            // Pastikan ada sisa yang masuk akal untuk kelas 5 (minimal 20)
            if (total - bagianA < 20) { bagianA = total - 120; }

            let bagianB = total - bagianA;

            // Tentukan bagian mana yang ditutup (?) -> 0: Kanan, 1: Kiri, 2: Atas
            posisiKosong = Math.floor(Math.random() * 3);

            // Reset tampilan wrapper agar bersih dari input box sebelumnya
            leftValEl.classList.remove('input-box-wrapper');
            rightValEl.classList.remove('input-box-wrapper');
            topValEl.classList.remove('input-box-wrapper');

            leftValEl.innerHTML = '';
            rightValEl.innerHTML = '';
            topValEl.innerHTML = '';

            if (posisiKosong === 2) {
                // Atas kosong (Tanya Total)
                topValEl.classList.add('input-box-wrapper');
                topValEl.innerHTML = '<input type="number" id="user-input" placeholder="?" autocomplete="off" inputmode="numeric">';
                leftValEl.innerText = bagianA;
                rightValEl.innerText = bagianB;
                jawabanBenar = total;
            } else if (posisiKosong === 1) {
                // Kiri kosong (Tanya Bagian)
                leftValEl.classList.add('input-box-wrapper');
                leftValEl.innerHTML = '<input type="number" id="user-input" placeholder="?" autocomplete="off" inputmode="numeric">';
                topValEl.innerText = total;
                rightValEl.innerText = bagianB;
                jawabanBenar = bagianA;
            } else {
                // Kanan kosong (Tanya Bagian)
                rightValEl.classList.add('input-box-wrapper');
                rightValEl.innerHTML = '<input type="number" id="user-input" placeholder="?" autocomplete="off" inputmode="numeric">';
                topValEl.innerText = total;
                leftValEl.innerText = bagianA;
                jawabanBenar = bagianB;
            }

            // Fokuskan ke input box baru
            const activeInput = document.querySelector('.input-box-wrapper input');
            activeInput.focus();
            
            // Enter key listener
            activeInput.addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    cekJawaban();
                }
            });
        }

        function cekJawaban() {
            const activeInput = document.querySelector('.input-box-wrapper input');
            if (!activeInput) return;
            const jawabanUser = parseInt(activeInput.value);

            if (isNaN(jawabanUser)) {
                feedbackEl.innerHTML = "<span class='wrong'>Masukkan angka dulu ya! 🤔</span>";
                return;
            }

            activeInput.disabled = true;
            document.getElementById('submit-btn').style.display = 'none';

            if (jawabanUser === jawabanBenar) {
                skor += 10;
                feedbackEl.innerHTML = "<span class='correct'>Benar! Luar Biasa! 🎉</span>";
            } else {
                feedbackEl.innerHTML = `<span class='wrong'>Kurang tepat. Jawabannya: ${jawabanBenar} 💡</span>`;
            }

            setTimeout(() => {
                soalKe++;
                if (soalKe > totalSoal) {
                    gameScreen.classList.add('hidden');
                    resultScreen.classList.remove('hidden');
                    finalScore.innerText = `Skor Akhir: ${skor}`;
                } else {
                    buatSoalBaru();
                }
            }, 2000); // Jeda 2 detik
        }

        // Jalankan game
        mulaiGame();
    </script>
</body>
</html>
